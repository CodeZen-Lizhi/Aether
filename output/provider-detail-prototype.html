<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>供应商详情原型</title>
<style>
:root{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#182235;background:#f5f7fb;--line:#e4e9f2;--muted:#71809a;--blue:#2563eb}*{box-sizing:border-box}body{margin:0;padding:32px;min-height:100vh}.shell{max-width:980px;margin:auto;background:#fff;border:1px solid var(--line);border-radius:22px;box-shadow:0 20px 55px #1b31500d;overflow:hidden}.hero{padding:26px 30px 22px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:24px}.eyebrow{font-size:12px;color:var(--muted);margin-bottom:8px}.title{display:flex;align-items:center;gap:12px;font-size:27px;font-weight:750;letter-spacing:-.03em}.pill{font-size:12px;padding:5px 10px;border-radius:999px;background:#eaf8ef;color:#17934a;font-weight:700}.url{display:inline-block;color:var(--blue);margin-top:8px;font-size:14px}.actions{display:flex;gap:8px}.icon{width:38px;height:38px;border:1px solid var(--line);border-radius:11px;background:#fff;font-size:18px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:18px 30px;background:#fbfcfe;border-bottom:1px solid var(--line)}.stat{padding:12px 14px;border:1px solid var(--line);border-radius:13px;background:#fff}.stat b{display:block;font-size:20px}.stat span{font-size:12px;color:var(--muted)}.tabs{display:flex;gap:8px;padding:16px 30px 0;border-bottom:1px solid var(--line)}.tab{border:0;background:transparent;padding:11px 15px;color:var(--muted);font-size:14px;font-weight:650;border-bottom:2px solid transparent}.tab.active{color:var(--blue);border-color:var(--blue)}.content{padding:22px 30px 30px}.section-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.section-head h2{font-size:17px;margin:0}.section-head p{color:var(--muted);font-size:12px;margin:5px 0 0}.primary{background:var(--blue);color:#fff;border:0;border-radius:10px;padding:10px 14px;font-weight:650}.row{display:grid;grid-template-columns:1.3fr 1fr auto;align-items:center;gap:20px;padding:16px 0;border-top:1px solid var(--line)}.identity{display:flex;align-items:center;gap:11px}.dot{width:9px;height:9px;border-radius:50%;background:#22c55e}.name{font-weight:700}.sub{display:block;color:var(--muted);font-size:12px;margin-top:4px}.price{text-align:right;font-size:13px;line-height:1.7}.price span{color:var(--muted)}.row-actions{display:flex;gap:6px}.small{width:34px;height:34px;border:1px solid var(--line);border-radius:9px;background:#fff}.mapping{display:grid;grid-template-columns:1.2fr 1.5fr auto;align-items:center;gap:18px;padding:15px 0;border-top:1px solid var(--line)}.tag{display:inline-flex;padding:5px 9px;border-radius:8px;background:#edf3ff;color:#2563eb;font:12px ui-monospace,monospace;margin:2px}.empty{padding:42px;text-align:center;border:1px dashed var(--line);border-radius:14px;color:var(--muted)}@media(max-width:700px){body{padding:0}.shell{border-radius:0;border-left:0;border-right:0}.hero,.stats,.tabs,.content{padding-left:18px;padding-right:18px}.row,.mapping{grid-template-columns:1fr;gap:8px}.price{text-align:left}.row-actions{justify-content:flex-start}.stats{gap:6px}.stat{padding:10px}.stat b{font-size:17px}}
</style></head><body><main class="shell"><header class="hero"><div><div class="eyebrow">供应商详情</div><div class="title">Input-国际线路 <span class="pill">活跃</span></div><a class="url">https://input.codes</a></div><div class="actions"><button class="icon">✎</button><button class="icon">◌</button><button class="icon">×</button></div></header><div class="stats"><div class="stat"><b>10.0<span style="font-size:12px;color:#17934a"> / 10</span></b><span>密钥健康度</span></div><div class="stat"><b>1</b><span>活跃密钥</span></div><div class="stat"><b>5</b><span>可用模型</span></div></div><nav class="tabs"><button class="tab active" data-tab="keys">密钥管理 · 1</button><button class="tab" data-tab="models">模型列表 · 5</button><button class="tab" data-tab="mapping">模型映射 · 4</button></nav><section class="content" id="content"></section></main><script>
const data={models:[['GPT-5.6 Luna','gpt-5.6-luna','$0.20 / $1.20'],['GPT-5.6 Sol','gpt-5.6-sol','$5.00 / $30.00'],['GPT-5.6 Terra','gpt-5.6-terra','$2.00 / $12.00'],['GPT-6 Astra','gpt-6-astra','$10.00 / $50.00'],['gpt-image-2','gpt-image-2','$5.00 / $30.00']]};
function render(tab){let c=document.querySelector('#content');if(tab==='models'){c.innerHTML='<div class="section-head"><div><h2>模型列表</h2><p>查看价格、测试模型或调整启用状态。</p></div><button class="primary">刷新模型</button></div>'+data.models.map(m=>`<div class="row"><div class="identity"><i class="dot"></i><div><span class="name">${m[0]}</span><span class="sub">${m[1]}</span></div></div><div class="price"><span>输入 / 输出</span> ${m[2]}<br><span>缓存</span> $0.25 / $0.02</div><div class="row-actions"><button class="small">▷</button><button class="small">✎</button><button class="small">◉</button></div></div>`).join('')}else if(tab==='keys'){c.innerHTML='<div class="section-head"><div><h2>密钥管理</h2><p>管理凭据、代理、限流和健康状态。</p></div><div style="display:flex;gap:8px"><button class="icon" title="刷新健康度">↻</button><button class="primary">＋ 添加密钥</button></div></div><div class="row"><div class="identity"><i class="dot"></i><div><span class="name">余额</span><span class="sub">sk-•••••••••••• · 自动同步</span></div></div><div class="price"><span>健康度</span> 10.0 / 10<br><span>RPM</span> 自适应</div><div class="row-actions"><button class="small">◉</button><button class="small">✎</button><button class="small">×</button></div></div>'}else{c.innerHTML='<div class="section-head"><div><h2>模型映射</h2><p>默认范围映射，按客户端模型独立维护。</p></div><button class="primary">批量映射</button></div>'+data.models.slice(0,4).map(m=>`<div class="mapping"><div><span class="name">${m[0]}</span><span class="sub">${m[1]}</span></div><div><span class="tag">${m[1]}</span></div><div class="row-actions"><button class="small">✎</button><button class="small">×</button></div></div>`).join('')}}</script><script>document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');render(b.dataset.tab)});render('keys')</script></body></html>
