<!doctype html><html><head><meta charset="utf-8"><title>使用记录筛选验收</title></head><body>
<div id="header-actions-right"></div><button id="finish">结束活跃请求</button><div id="app"></div>
<script type="module">
import {createApp} from 'vue';
import {createPinia} from 'pinia';
import Usage from '/src/views/shared/Usage.vue';
import {usageApi} from '/src/api/usage.ts';
import '/src/style.css';
// 固定接口数据挂载真实使用记录页；此入口只证明 UI 与轮询，不证明真实后端。
const now=new Date().toISOString();
const cacheReadByRequest={
 'compact-failed-stream':78000,
 'chat-completed-standard':0,
 'realtime-completed-ws':0,
 'chat-pending-stream':42000,
 'video-streaming-standard':18000,
 'chat-cancelled-standard':6400,
};
const cacheCreationByRequest={
 'compact-failed-stream':12000,
 'chat-completed-standard':0,
 'realtime-completed-ws':0,
 'chat-pending-stream':8000,
 'video-streaming-standard':2000,
 'chat-cancelled-standard':1600,
};
const costByRequest={
  'compact-failed-stream':0.001044,
  'chat-completed-standard':0.001236,
  'realtime-completed-ws':0.000820,
  'chat-pending-stream':0.000612,
  'video-streaming-standard':0.005601,
  'chat-cancelled-standard':0.000228,
};
const timingByRequest={
  'compact-failed-stream':{first:3150,total:6920},
  'chat-completed-standard':{first:250,total:1180},
  'realtime-completed-ws':{first:120,total:860},
  'chat-pending-stream':{first:340,total:2510},
  'video-streaming-standard':{first:280,total:1740},
  'chat-cancelled-standard':{first:500,total:2500},
};
const rows=[
 ['compact-failed-stream','compact','failed',true,false,false,true],
 ['chat-completed-standard','chat','completed',false,false,false,false],
 ['realtime-completed-ws','realtime','completed',true,true,false,false],
 ['chat-pending-stream','chat','pending',true,false,false,false],
 ['video-streaming-standard','video','streaming',false,false,true,false],
 ['chat-cancelled-standard','chat','cancelled',false,true,false,false],
].map(([id,request_type,status,stream,websocket,retry,fallback])=>{
 const cacheRead=cacheReadByRequest[id]||0;
 const cacheCreation=cacheCreationByRequest[id]||0;
 const freshInput=request_type==='chat'?1200:request_type==='realtime'?600:800;
 let totalTokens=freshInput;
 totalTokens+=cacheRead;
 totalTokens+=cacheCreation;
 totalTokens+=240;
 const timing=timingByRequest[id];
 return {id,model:id,request_type,provider:'fixture',api_format:'openai:responses',is_stream:stream,is_websocket:websocket,upstream_is_stream:stream,client_requested_stream:stream,status,input_tokens:freshInput+cacheRead+cacheCreation,effective_input_tokens:freshInput,output_tokens:240,cache_creation_input_tokens:cacheCreation,cache_read_input_tokens:cacheRead,total_tokens:totalTokens,cost:costByRequest[id],has_retry:retry,has_fallback:fallback,created_at:now,updated_at:now,first_byte_time_ms:timing.first,response_time_ms:status==='pending'?null:timing.total,end_to_end_first_byte_time_ms:status==='pending'?null:timing.first,end_to_end_time_ms:status==='pending'?null:timing.total};
});
// 保留查询参数，核对下拉事件是否实际触发分页请求。
window.fixtureRequests=[];
window.fixtureRequestTypeCalls=0;
usageApi.getAllUsageRecords=async params=>{
 window.fixtureRequests.push({...params});
 const result=rows.filter(row=>{
  if(params.request_status==='active'&&!['pending','streaming'].includes(row.status))return false;
  if(params.request_status==='failed'&&row.status!=='failed')return false;
  if(params.request_status==='cancelled'&&row.status!=='cancelled')return false;
  if(params.transport==='websocket'&&!row.is_websocket)return false;
  if(params.transport==='stream'&&(row.is_websocket||!row.client_requested_stream))return false;
  if(params.transport==='standard'&&(row.is_websocket||row.client_requested_stream))return false;
  if(params.attempt==='retry'&&!row.has_retry)return false;
  if(params.attempt==='fallback'&&!row.has_fallback)return false;
  return true;
 });
 return {records:structuredClone(result),total:result.length,total_is_estimated:false};
};
usageApi.getActiveRequests=async ids=>({requests:structuredClone(rows.filter(row=>ids?ids.includes(row.id):['pending','streaming'].includes(row.status)))});
usageApi.getUsageStats=async()=>({});
usageApi.getUsageByModel=async()=>[];
usageApi.getUsageByProvider=async()=>[];
usageApi.getUsageByApiFormat=async()=>[];
usageApi.getUsageByRequestType=async()=>{window.fixtureRequestTypeCalls++;return[]};
document.querySelector('#finish').onclick=()=>{for(const row of rows){if(['pending','streaming'].includes(row.status)){row.status='completed';row.updated_at=new Date().toISOString();}}};
createApp(Usage).use(createPinia()).mount('#app');
</script></body></html>
