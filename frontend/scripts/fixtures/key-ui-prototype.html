<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>密钥管理 · 设计预览</title><style>
:root{--ink:#192234;--muted:#737d90;--line:#e9ecf2;--blue:#4263eb;--soft:#f5f7fb}*{box-sizing:border-box}body{margin:0;background:#f1f3f8;color:var(--ink);font:14px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}button,input{font:inherit}button{cursor:pointer;border:0;background:none;color:inherit}button:focus-visible,input:focus-visible{outline:3px solid #acbcff;outline-offset:3px}main{max-width:1040px;margin:40px auto 110px;background:white;border:1px solid var(--line);border-radius:20px;box-shadow:0 16px 70px #23375c08}header{padding:28px 30px 0}.eyebrow{color:var(--muted);font-size:12px;margin-bottom:12px}h1{font-size:24px;margin:0;font-weight:650;letter-spacing:-.5px}.head,.toolbar,.identity,.actions,.meta{display:flex;align-items:center;gap:12px}.head{justify-content:space-between}.dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:#2baa74;margin-right:6px}.status{font-size:12px;color:#288760;background:#edf8f1;padding:4px 9px;border-radius:6px}.subtitle{color:var(--muted);font-size:13px;margin:8px 0 22px}.tabs{display:flex;gap:28px;border-bottom:1px solid var(--line);color:var(--muted)}.tabs span{padding:12px 0}.tabs .active{color:var(--blue);border-bottom:2px solid var(--blue);font-weight:600}section{padding:24px 30px 30px}.toolbar{justify-content:space-between;margin-bottom:18px}.toolbar strong{font-size:15px}.count{color:var(--muted);font-size:12px;margin-left:8px}.primary{background:var(--blue);color:#fff;border-radius:8px;padding:9px 15px}.list{border:1px solid var(--line);border-radius:12px}.row{position:relative;padding:20px;border-bottom:1px solid var(--line)}.row:last-child{border:0}.identity{justify-content:space-between}.name{font-weight:600;font-size:14px}.secret{font-size:12px;color:var(--muted);font-family:ui-monospace,monospace;margin-top:4px}.actions{gap:5px}.icon{height:34px;min-width:34px;border-radius:7px;color:#727c8c;display:inline-flex;align-items:center;justify-content:center}.icon:hover,.sync:hover{background:var(--soft);color:var(--blue)}svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}.meta{margin-top:14px;font-size:12px;gap:16px;color:var(--muted);flex-wrap:wrap}.protocol{border:1px solid var(--line);padding:2px 7px;border-radius:5px;font-size:11px}.rate{display:inline-flex;align-items:center;gap:8px;padding:4px 8px;border-radius:6px;color:var(--ink);background:#f5f7fb;font-size:13px}.rate b{font-variant-numeric:tabular-nums}.rate small{color:var(--muted);font-size:11px}.auto{color:var(--blue)!important}.sync{display:inline-flex;align-items:center;gap:6px;color:#52617b;padding:7px 9px;border-radius:7px;font-size:12px}.hint{font-size:11px;color:var(--muted)}.footer{margin-top:16px;color:var(--muted);font-size:12px}.switcher{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:8px;background:#1c2538;color:white;padding:7px;border-radius:14px;box-shadow:0 8px 30px #17233d30;white-space:nowrap}.switcher button{padding:9px 12px;border-radius:8px;font-size:12px}.switcher .on{background:#fff;color:#24324e}.prototype{font-size:11px;color:#bbc4d6;padding:0 8px}dialog{border:1px solid var(--line);border-radius:16px;padding:24px;width:360px;box-shadow:0 20px 90px #18244625;color:var(--ink)}dialog::backdrop{background:#18243b22;backdrop-filter:blur(2px)}dialog h2{font-size:18px;margin:0 0 4px}dialog p{color:var(--muted);font-size:12px}label{display:block;margin-top:18px;font-size:12px}.segments{display:flex;padding:4px;background:var(--soft);border-radius:8px;margin-top:8px}.segments button{flex:1;padding:9px;border-radius:6px}.segments .selected{background:white;color:var(--blue);box-shadow:0 1px 5px #00000010}input{width:100%;padding:10px;border:1px solid #dfe3ec;border-radius:8px;margin-top:8px}dialog footer{display:flex;justify-content:flex-end;gap:12px;margin-top:22px}.table .row{display:grid;grid-template-columns:1fr 110px 110px 125px;align-items:center;gap:12px}.table .identity{display:block}.table .meta{margin:0}.table .hint{display:none}.table-head{display:grid;grid-template-columns:1fr 110px 110px 125px;padding:10px 20px;gap:12px;color:var(--muted);font-size:12px;background:var(--soft);border-radius:12px 12px 0 0}.split{display:grid;grid-template-columns:1fr 310px;gap:20px}.split .row{cursor:pointer}.split .row.selected{background:#f3f6ff}.split .meta,.split .actions{display:none}.detail{border:1px solid var(--line);border-radius:12px;padding:22px}.detail h3{font-size:15px;margin:0}.large{font-size:36px;font-weight:650;letter-spacing:-1px;margin:25px 0 0}.large small{font-size:16px;color:var(--muted)}.detail .sync{margin-top:20px;border:1px solid var(--line);width:100%;justify-content:center}.toast{position:fixed;top:16px;left:50%;transform:translateX(-50%);background:#213249;color:white;border-radius:10px;padding:12px 18px;box-shadow:0 8px 30px #0002;display:none;z-index:5}@media(max-width:740px){main{margin:12px 10px 110px}header{padding:20px 18px 0}section{padding:20px 16px}.row{padding:16px}.actions{gap:0}.hint{display:none}.table .row,.table-head{grid-template-columns:1fr 80px 100px}.table .actions{grid-column:1/-1;justify-content:flex-end}.split{grid-template-columns:1fr}.switcher{gap:0}.switcher button{padding:9px}.prototype{display:none}}
</style><main><header><div class="eyebrow">供应商 / 密钥管理</div><div class="head"><h1>Loomex <span class="status"><i class="dot"></i>已启用</span></h1><button class="icon" title="更多设置">···</button></div><p class="subtitle">管理上游密钥、访问方式与成本倍率</p><div class="tabs"><span class="active">密钥 <small>3</small></span><span>模型</span><span>模型映射</span></div></header><section><div class="toolbar"><div><strong>供应商密钥</strong><span class="count">3 个密钥</span></div><button class="primary" onclick="notify('设计预览：添加密钥入口')">＋ 添加密钥</button></div><div id="content"></div><p class="footer">跟随上游的密钥随余额监控周期更新。同步失败时，继续使用当前倍率。</p></section></main><nav class="switcher" aria-label="预览方案"><span class="prototype">设计预览</span><button data-v="A">A · 紧凑列表</button><button data-v="B">B · 对齐表格</button><button data-v="C">C · 详情侧栏</button></nav><div class="toast" role="status" id="toast"></div><dialog id="settings"><h2>倍率设置</h2><p id="keyname"></p><label>倍率来源</label><div class="segments"><button id="manual" onclick="setMode(false)">手动设置</button><button id="auto" onclick="setMode(true)">跟随上游</button></div><label for="value" id="valuelabel">当前倍率</label><input id="value" type="number" min="0" step="0.01"><p id="help"></p><footer><button onclick="settings.close()">取消</button><button class="primary" onclick="save()">保存设置</button></footer></dialog><script>
// 一次性 UI 原型；所有交互仅修改内存中的模拟数据。
const items=[{name:'Codex · 官方高缓存',secret:'sk-••••••••A7f2',value:.3,auto:true},{name:'Claude · 日常主力',secret:'sk-••••••••B8c1',value:.5,auto:false},{name:'通用备用密钥',secret:'sk-••••••••C9d4',value:1,auto:false}];let variant=new URLSearchParams(location.search).get('variant')||'A',selected=0,editing=0,draft=false;const icons={sync:'<path d="M20 7v5h-5M4 17v-5h5"/><path d="M6 7a7 7 0 0 1 12-1l2 6M4 12l2 6a7 7 0 0 0 12-1"/>',edit:'<path d="m14 5 5 5M4 20l4-1L20 7l-5-5L3 14z"/>',power:'<path d="M12 2v10M6 5a9 9 0 1 0 12 0"/>'};const icon=n=>`<svg viewBox="0 0 24 24" aria-hidden="true">${icons[n]}</svg>`;function actions(i){return `<div class="actions">${items[i].auto?`<button class="sync" onclick="event.stopPropagation();sync(${i},this)">${icon('sync')}<span>同步倍率</span></button>`:''}<button class="icon" aria-label="编辑${items[i].name}" onclick="event.stopPropagation();openSettings(${i})">${icon('edit')}</button><button class="icon" aria-label="启停${items[i].name}" onclick="event.stopPropagation();notify('设计预览：密钥开关')">${icon('power')}</button></div>`}function rate(i){const x=items[i];return `<button class="rate" onclick="event.stopPropagation();openSettings(${i})" aria-label="设置${x.name}的倍率"><b>${x.value}×</b><small class="${x.auto?'auto':''}">${x.auto?'跟随上游':'手动'} ⌄</small></button>`}function render(){document.querySelectorAll('[data-v]').forEach(b=>b.classList.toggle('on',b.dataset.v===variant));content.className=variant==='B'?'list table':variant==='C'?'split':'list';content.innerHTML=(variant==='B'?'<div class="table-head"><span>密钥</span><span>成本倍率</span><span>倍率来源</span><span>操作</span></div>':'')+(variant==='C'?'<div class="list">':'')+items.map((x,i)=>variant==='B'?`<article class="row"><div><div class="name">${x.name}</div><div class="secret">${x.secret}</div></div><button class="rate" onclick="openSettings(${i})"><b>${x.value}×</b> ⌄</button><span class="${x.auto?'auto':'hint'}" style="display:block;font-size:12px">${x.auto?'跟随上游':'手动设置'}</span>${actions(i)}</article>`:`<article class="row ${selected===i?'selected':''}" onclick="choose(${i})"><div class="identity"><div><div class="name">${x.name}</div><div class="secret">${x.secret}</div></div>${actions(i)}</div><div class="meta"><span class="protocol">OpenAI</span>${rate(i)}${x.auto?'<span class="hint">高缓存分组 · 最近成功 14:32</span>':''}<span><i class="dot"></i>正常</span></div></article>`).join('')+(variant==='C'?`</div><aside class="detail"><div class="eyebrow">倍率设置</div><h3>${items[selected].name}</h3><div class="large">${items[selected].value}<small> ×</small></div><div class="subtitle">当前生效倍率</div>${rate(selected)}<p class="hint" style="display:block;margin-top:20px">${items[selected].auto?'最近成功同步于 14:32':'保持此倍率，直到你手动修改。'}</p>${items[selected].auto?`<button class="sync" onclick="sync(${selected},this)">${icon('sync')}立即同步倍率</button>`:''}</aside>`:'')}
function choose(i){if(variant==='C'){selected=i;render()}}function openSettings(i){editing=i;draft=items[i].auto;keyname.textContent=items[i].name;value.value=items[i].value;setMode(draft);settings.showModal()}function setMode(a){draft=a;manual.classList.toggle('selected',!a);auto.classList.toggle('selected',a);value.disabled=a;help.textContent=a?'成功同步后更新倍率；认证失效或同步失败时保留当前值。':'默认 1×。保存后固定使用你填写的倍率。'}function save(){const n=Number(value.value);if(!draft&&(!Number.isFinite(n)||n<0||value.value===''))return;items[editing].auto=draft;if(!draft)items[editing].value=n;settings.close();render();notify('预览设置已更新')}function sync(i,b){b.disabled=true;b.innerHTML='同步中…';setTimeout(()=>{render();notify(`已同步，当前倍率 ${items[i].value}×（模拟结果）`)},650)}let timer;function notify(s){toast.textContent=s;toast.style.display='block';clearTimeout(timer);timer=setTimeout(()=>toast.style.display='none',2500)}document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{variant=b.dataset.v;history.replaceState(null,'','?variant='+variant);render()});render();
</script></html>
