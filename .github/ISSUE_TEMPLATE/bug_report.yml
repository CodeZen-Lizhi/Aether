name: Bug 报告
description: 报告可复现的功能异常、界面问题或回归
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。请先搜索现有 Issue，并移除日志、截图和配置中的真实密钥与个人数据。
  - type: input
    id: version
    attributes:
      label: 版本或提交
      description: 桌面应用版本、Docker 镜像标签或 Git 提交。
      placeholder: 例如 0.1.80 或 ef8cd3330
    validations:
      required: true
  - type: dropdown
    id: deployment
    attributes:
      label: 运行方式
      options:
        - macOS 桌面版
        - Docker Compose
        - 源码运行
        - 其他
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 环境
      description: 操作系统、架构、浏览器或相关客户端版本。
      placeholder: 例如 macOS 15 / Apple Silicon / Codex CLI x.y
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 给出能稳定触发问题的最短步骤和必要数据前提。
      placeholder: |
        1. 打开……
        2. 配置……
        3. 执行……
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
      description: 可附脱敏截图、相关请求 ID 和错误码。
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 日志或补充信息
      description: 请移除 API Key、Cookie、JWT、请求正文和个人数据。
      render: shell
  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私确认
      options:
        - label: 我已移除真实密钥、Cookie、账户信息和请求正文
          required: true
