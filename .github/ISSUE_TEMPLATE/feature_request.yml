name: 功能建议
description: 提议新的能力、改进或产品方向
title: "[Feature] "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: 需要解决的问题
      description: 说明当前工作流、用户目标和现有缺口，不先限定实现方式。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 描述期望行为、入口、状态和可观察结果。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案
      description: 目前如何绕过，以及已经考虑过哪些替代实现。
  - type: textarea
    id: impact
    attributes:
      label: 影响范围
      description: 是否涉及协议、数据库、权限、并发、迁移、依赖或平台差异。
  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索现有 Issue 和文档
          required: true
        - label: 该建议不包含真实密钥、账户或请求数据
          required: true
